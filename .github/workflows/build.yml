name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Package.swift 需要 swift-tools 6.2（Xcode 26）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" || true
          swift --version

      - name: Test core
        run: swift test

      - name: Package
        run: |
          swift scripts/make-icon.swift Resources/CodeZhuyin.tiff  # 選單列圖示「碼」
          # 偏好設定「更新」分頁拿這個跟 latest-main 比對
          /usr/libexec/PlistBuddy -c "Add :CZBuildCommit string $GITHUB_SHA" Resources/Info.plist
          # 每次建置自動遞增：0.1.<run number>，zip 檔名跟著變
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.1.$GITHUB_RUN_NUMBER" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          CODESIGN_IDENTITY=- scripts/make-release.sh
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: CodeZhuyin
          path: build/CodeZhuyin-*.zip

      # main 每次推送都更新「最新開發版」，下載頁固定：Releases › latest-main
      - name: Publish latest-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 說明＝CHANGELOG.md 的「未發佈」段落＋安裝步驟
          awk '/^## 未發佈/{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n安裝：解壓後在資料夾內執行 `xattr -dr com.apple.quarantine . && ./安裝碼注音.command`；已安裝 0.1.13 以後的版本可直接用偏好設定的「更新」頁。\n' >> notes.md
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main build/CodeZhuyin-*.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "最新開發版 0.1.${GITHUB_RUN_NUMBER}（main @ ${GITHUB_SHA::7}）" \
            --notes-file notes.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CodeZhuyin-*.zip --generate-notes
